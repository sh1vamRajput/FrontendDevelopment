<!-- 9. Create a card flip animation using CSS Transformations and Transitions.
Requirements:
● Build one card that flips 180 degrees on hover.
● Front side: shows title and image.
● Back side: shows text description.
● Use transform-style: preserve-3d; and perspective: 1000px;.
● Implement the flip using transform: rotateY(180deg); and smooth transitions.
● Card must remain centered on screen using Flexbox. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip Animation</title>
  <link rel="stylesheet" href="9.css">
</head>
<body>

  <div class="card-container">
    <div class="card">
      <div class="card-front">
        <img src="https://picsum.photos/id/237/300/200" alt="Card Image">
        <h2>Adventure Awaits</h2>
      </div>
      <div class="card-back">
        <p>Embark on an unforgettable journey through nature’s most beautiful landscapes. Explore, dream, discover!</p>
      </div>
    </div>
  </div>

</body>
</html>
