<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase Layout</title>
  <link rel="stylesheet" href="showcase.css">
</head>
<body>
  <header>
    <h2>Image Showcase Layout</h2>
    <p>Hover over the images to see the scaling and overlay effect.</p>
  </header>

  <main class="gallery">
    <figure class="card">
      <img src="https://via.placeholder.com/300x200" alt="Image 1">
      <figcaption>Beautiful Landscape</figcaption>
    </figure>

    <figure class="card">
      <img src="https://via.placeholder.com/300x200" alt="Image 2">
      <figcaption>City at Night</figcaption>
    </figure>

    <figure class="card">
      <img src="https://via.placeholder.com/300x200" alt="Image 3">
      <figcaption>Mountain View</figcaption>
    </figure>

    <figure class="card">
      <img src="https://via.placeholder.com/300x200" alt="Image 4">
      <figcaption>Sunny Beach</figcaption>
    </figure>

    <figure class="card">
      <img src="https://via.placeholder.com/300x200" alt="Image 5">
      <figcaption>Green Forest</figcaption>
    </figure>

    <figure class="card">
      <img src="https://via.placeholder.com/300x200" alt="Image 6">
      <figcaption>Desert Dunes</figcaption>
    </figure>
  </main>

  <footer>
    <p>Responsive image showcase created using Grid and Flexbox.</p>
  </footer>
</body>
</html>
