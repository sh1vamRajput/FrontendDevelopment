<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Cards with Animation</title>
  <link rel="stylesheet" href="filter-cards.css">
</head>
<body>

  <header>
    <h1>Profile Cards with Filter & Animation</h1>
  </header>

  <main class="card-container">
    <div class="card">
      <img src="https://via.placeholder.com/250x180" alt="Profile 1">
      <h2>John Doe</h2>
      <p>Web Developer passionate about creating clean and responsive designs.</p>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/250x180" alt="Profile 2">
      <h2>Jane Smith</h2>
      <p>Graphic Designer who loves experimenting with modern layouts.</p>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/250x180" alt="Profile 3">
      <h2>Alex Johnson</h2>
      <p>UI/UX Designer focused on simplicity and user experience.</p>
    </div>
  </main>

</body>
</html>
