<!-- 9. Design an Outline and Focus Styling Form
Requirements:
● Create a small form with input and textarea elements.
● Demonstrate various outline styles and outline-offset.
● Change outline color on focus using the :focus selector.
● Add padding, border-radius, and subtle shadows for neat
appearance.
● Ensure uniform spacing between form elements. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outline and Focus Styling Form</title>
  <link rel="stylesheet" href="9.css">
</head>
<body>
  <header>
    <h1>Outline & Focus Styling Form</h1>
    <p>Demonstrating modern focus outlines and accessible form design.</p>
  </header>

  <main>
    <form class="outline-form">
      <label for="name">Your Name</label>
      <input type="text" id="name" placeholder="Enter your name">

      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="example@mail.com">

      <label for="message">Your Message</label>
      <textarea id="message" rows="4" placeholder="Type your message..."></textarea>

      <button type="submit">Submit</button>
    </form>
  </main>

  <footer>
    <p>Designed by Aaditya Ranjan Moitra</p>
  </footer>
</body>
</html>
