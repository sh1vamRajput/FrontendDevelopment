<!-- 8. Build a photo gallery using Grid with hover transformations.
Requirements:
● Use grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));.

● Each image should fill its grid cell completely and scale up slightly on hover.
● Add transition: transform 0.5s ease; for smooth zoom effect.
● Include image captions below each image using <figcaption>.
● Layout should automatically adjust to screen size. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aaditya's Photo Gallery</title>
  <link rel="stylesheet" href="8.css">
</head>
<body>

  <section class="gallery-section">
    <h1 class="title">📸 Aaditya's Photo Gallery</h1>

    <div class="gallery">
      <figure>
        <img src="https://picsum.photos/id/1011/600/400" alt="Mountain View">
        <figcaption>Mountain View</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1025/600/400" alt="Dog Portrait">
        <figcaption>Dog Portrait</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1043/600/400" alt="Forest Path">
        <figcaption>Forest Path</figcaption>
      </figure>
      <figure>
          <img src="https://picsum.photos/id/1069/600/400" alt="Jelly Fish">
          <figcaption>Jelly Fish</figcaption>
        </figure>
        <figure>
          <img src="https://picsum.photos/id/1059/600/400" alt="Still Life">
          <figcaption>Still Life</figcaption>
        </figure>
        <figure>
        <img src="https://picsum.photos/id/1084/600/400" alt="Walrus">
        <figcaption>Walrus</figcaption>
      </figure>
    </div>
  </section>

</body>
</html>
