<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>

  <header>
    <h1>Responsive Image Filter Gallery</h1>
  </header>

  <main class="gallery">
    <figure>
      <img src="https://picsum.photos/id/1015/400/300" alt="Mountain">
      <figcaption>Blur Effect</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1016/400/300" alt="Forest">
      <figcaption>Grayscale Effect</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1024/400/300" alt="Dog">
      <figcaption>Sepia Effect</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1039/400/300" alt="River">
      <figcaption>Brightness Effect</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1040/400/300" alt="Desert">
      <figcaption>Contrast Effect</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1056/400/300" alt="Beach">
      <figcaption>Hue Rotate Effect</figcaption>
    </figure>
  </main>

  <footer>
    <p>&copy; 2025 Responsive Gallery Demo</p>
  </footer>

</body>
</html>
