<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="6.css">
</head>
<body>
  <header>
    <h1>CSS Transformations</h1>
    <p>Elegant. Subtle. Modern motion design with pure CSS.</p>
  </header>

  <main class="showcase">
    <div class="card rotate">
      <div class="shape"></div>
      <h2>Rotate</h2>
      <p>transform: rotate(45deg)</p>
    </div>

    <div class="card scale">
      <div class="shape"></div>
      <h2>Scale</h2>
      <p>transform: scale(1.2)</p>
    </div>

    <div class="card translate">
      <div class="shape"></div>
      <h2>Translate</h2>
      <p>transform: translateY(-20px)</p>
    </div>

    <div class="card skew">
      <div class="shape"></div>
      <h2>Skew</h2>
      <p>transform: skew(10deg, 5deg)</p>
    </div>
  </main>

  <footer>
    <p>Designed by Aaditya Ranjan Moitra</p>
  </footer>
</body>
</html>
