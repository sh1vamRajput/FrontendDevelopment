<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
    <style>
        body {
            background: linear-gradient(135deg, #dbe6f6, #c5796d);
            font-family: "Poppins", sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .about {
            background-color: #fff;
            padding: 40px;
            width: 450px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2); /* Shadow property */
        }

        h2 {
            text-align: center;               /* Typography property 1 */
            text-transform: uppercase;        /* Typography property 2 */
            letter-spacing: 2px;              /* Typography property 3 */
            color: #2c3e50;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2); /* Shadow property */
        }

        p {
            font-family: "Open Sans", sans-serif; /* Typography property 4 */
            font-size: 16px;
            line-height: 1.8;                     /* Typography property 5 */
            color: #555;
            text-align: justify;
        }
    </style>
</head>
<body>
    <div class="about">
        <h2>About Me</h2>
        <p>
            Hello! I’m <b>Shivam Rajput</b>, a Computer Science student with a passion 
            for web development, data analytics, and AI-based applications. I enjoy creating 
            projects that blend creativity with technology to solve real-world problems.
        </p>
    </div>
</body>
</html>
