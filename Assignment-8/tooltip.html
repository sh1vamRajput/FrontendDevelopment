<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Demo</title>
  <link rel="stylesheet" href="tooltip.css">
</head>
<body>
  <main class="container">
    <h2>CSS Tooltip Demonstration</h2>

    <div class="tooltip">
      <span class="tooltiptext">Save your work</span>
    </div>

    <div class="tooltip">
      <span class="tooltiptext">Delete this file</span>
    </div>

    <div class="tooltip">
      <span class="tooltiptext">Share with others</span>
    </div>

    <div class="tooltip">
      <span class="tooltiptext">More information</span>
    </div>
  </main>
</body>
</html>
