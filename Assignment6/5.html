<!-- 5. Design a pricing section using Flexbox.
Requirements:
● Create three pricing cards aligned horizontally.
● The middle card should be slightly larger and highlighted with a different background
color.
● On hover, cards should rise up slightly (transform: translateY(-10px)), with a
smooth transition.

● Add a simple fade-in animation for all three cards when the page loads using
@keyframes.
● Make the layout stack vertically below 750px. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Section</title>
  <link rel="stylesheet" href="5.css">
</head>
<body>

  <section class="pricing-section">
    <h1 class="title">Our Pricing Plans</h1>

    <div class="pricing-container">

      <!-- Basic Plan -->
      <div class="card">
        <h2>Basic</h2>
        <p class="price">$9<span>/mo</span></p>
        <ul>
          <li>✔ 5 Projects</li>
          <li>✔ Basic Support</li>
          <li>✔ Access to Community</li>
        </ul>
        <button>Get Started</button>
      </div>

      <!-- Pro Plan -->
      <div class="card highlight">
        <h2>Pro</h2>
        <p class="price">$29<span>/mo</span></p>
        <ul>
          <li>✔ 20 Projects</li>
          <li>✔ Priority Support</li>
          <li>✔ Advanced Analytics</li>
        </ul>
        <button>Choose Plan</button>
      </div>

      <!-- Premium Plan -->
      <div class="card">
        <h2>Premium</h2>
        <p class="price">$59<span>/mo</span></p>
        <ul>
          <li>✔ Unlimited Projects</li>
          <li>✔ 24/7 Support</li>
          <li>✔ Dedicated Manager</li>
        </ul>
        <button>Go Premium</button>
      </div>

    </div>
  </section>

</body>
</html>
