<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Layout</title>
  <link rel="stylesheet" href="responsive-layout.css">
</head>
<body>

  <header class="header">
    <div class="logo">MyLogo</div>
    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="main">
    <section class="feature">
      <h2>Feature One</h2>
      <p>Clean, responsive, and minimal layout using Flexbox.</p>
    </section>
    <section class="feature">
      <h2>Feature Two</h2>
      <p>Adapts to any screen size from desktop to mobile.</p>
    </section>
    <section class="feature">
      <h2>Feature Three</h2>
      <p>Hover to see smooth scaling transition effects.</p>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2025 Responsive Layout Demo</p>
  </footer>

</body>
</html>
