<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini User Interface Layout</title>
  <link rel="stylesheet" href="mini-ui.css">
</head>
<body>
  <header>
    <h1>My Mini UI Layout</h1>
  </header>

  <main class="card">
    <img src="https://via.placeholder.com/150" alt="Profile" class="profile-img">

    <form class="form">
      <input type="text" placeholder="Enter your name" required>
      <input type="email" placeholder="Enter your email" required>
      <div class="button-group">
        <button type="submit" class="btn primary">Submit</button>
        <button type="reset" class="btn secondary">Reset</button>
      </div>
    </form>
  </main>

  <footer>
    <p>Created using HTML and CSS only | Demonstration of Flexbox UI layout</p>
  </footer>
</body>
</html>
