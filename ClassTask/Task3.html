<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern UI Card</title>
    <style>
        body {
            background: linear-gradient(135deg, #74ebd5, #ACB6E5); /* Soft gradient background */
            font-family: "Poppins", sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: #fff;
            width: 350px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2); /* Modern soft shadow */
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        h2 {
            color: #2c3e50;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2); /* Text shadow */
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Modern UI Card</h2>
        <p>
            This is a simple card design using box-shadow and text-shadow to create
            a clean and modern look. Hover over it to see the effect!
        </p>
    </div>
</body>
</html>
