<!-- 10. Create a Navigation Bar with Transitions and Hover Effects
Requirements:
● Build a horizontal navigation bar with five links.
● Add padding, borders, and smooth hover transitions (transition: all
0.3s ease;).
● Highlight the active link with a distinct background or underline.
● Make the navbar responsive—stack vertically below 700px.
● Include a footer section with simple centered text. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Bar with Transitions</title>
  <link rel="stylesheet" href="10.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">Aadi<span>Designs</span></div>
      <ul class="nav-links">
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="content">
      <h1>Welcome to Aaditya's Design Studio</h1>
      <p>Clean, responsive, and modern navigation built with pure CSS transitions.</p>
    </section>
  </main>

  <footer>
    <p>© 2025 Aaditya Ranjan Moitra — All rights reserved.</p>
  </footer>
</body>
</html>
