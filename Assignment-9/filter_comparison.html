<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="filter_comparison.css">
</head>
<body>
  <header>
    <h1>Before and After Filter Comparison</h1>
  </header>

  <main class="comparison-container">
    <div class="image-box">
      <img src="https://via.placeholder.com/400x250" alt="Original Image">
      <p>Original Image</p>
    </div>

    <div class="image-box filtered">
      <img src="https://via.placeholder.com/400x250" alt="Filtered Image">
      <p>Filtered (Brightness Reduced)</p>
    </div>
  </main>

  <footer>
    <p>Responsive Filter Comparison Demo | © 2025</p>
  </footer>
</body>
</html>
