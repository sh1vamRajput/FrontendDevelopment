<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Product Search</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .search-input-wrapper {
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 15px 50px 15px 20px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s ease;
        }

        #searchInput:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 20px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: white;
            font-size: 18px;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 0.5s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f5f5f5;
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .product-price {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .no-results-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .no-results h2 {
            color: #666;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .no-results p {
            color: #999;
            font-size: 16px;
        }

        .result-count {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛍️ Product Search</h1>
        
        <div class="search-box">
            <div class="search-input-wrapper">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search for products..."
                    autocomplete="off"
                >
                <span class="search-icon">🔍</span>
            </div>
        </div>

        <div class="loading" id="loading">
            <span class="spinner"></span>
            <span>Searching...</span>
        </div>

        <div class="result-count" id="resultCount"></div>

        <div id="results"></div>
    </div>

    <script>
        $(document).ready(function() {
            const API_URL = 'http://localhost:3001/products';
            let searchTimeout;

            // Load all products on page load
            loadProducts();

            // Live search on input
            $('#searchInput').on('input', function() {
                clearTimeout(searchTimeout);
                const query = $(this).val().trim();

                // Debounce: wait 300ms after user stops typing
                searchTimeout = setTimeout(function() {
                    if (query.length > 0) {
                        searchProducts(query);
                    } else {
                        loadProducts();
                    }
                }, 300);
            });

            function searchProducts(query) {
                showLoading();

                $.ajax({
                    url: API_URL,
                    method: 'GET',
                    data: { q: query },
                    dataType: 'json',
                    success: function(data) {
                        hideLoading();
                        displayProducts(data, query);
                    },
                    error: function(xhr, status, error) {
                        hideLoading();
                        console.error('Search error:', error);
                        $('#results').html(
                            '<div class="no-results">' +
                                '<div class="no-results-icon">⚠️</div>' +
                                '<h2>Error Loading Products</h2>' +
                                '<p>Please make sure JSON Server is running on port 3001</p>' +
                            '</div>'
                        );
                    }
                });
            }

            function loadProducts() {
                showLoading();

                $.ajax({
                    url: API_URL,
                    method: 'GET',
                    dataType: 'json',
                    success: function(data) {
                        hideLoading();
                        displayProducts(data);
                    },
                    error: function(xhr, status, error) {
                        hideLoading();
                        console.error('Load error:', error);
                        $('#results').html(
                            '<div class="no-results">' +
                                '<div class="no-results-icon">⚠️</div>' +
                                '<h2>Error Loading Products</h2>' +
                                '<p>Please make sure JSON Server is running on port 3001</p>' +
                            '</div>'
                        );
                    }
                });
            }

            function displayProducts(products, searchQuery) {
                const resultsContainer = $('#results');
                const resultCount = $('#resultCount');

                if (products.length === 0) {
                    resultCount.hide();
                    resultsContainer.html(
                        '<div class="no-results">' +
                            '<div class="no-results-icon">🔍</div>' +
                            '<h2>No products found</h2>' +
                            '<p>Try searching with different keywords</p>' +
                        '</div>'
                    );
                    return;
                }

                // Show result count
                if (searchQuery) {
                    resultCount.text(`Found ${products.length} product${products.length !== 1 ? 's' : ''} for "${searchQuery}"`).show();
                } else {
                    resultCount.text(`Showing all ${products.length} products`).show();
                }

                // Display products
                let html = '';
                products.forEach(function(product) {
                    html += `
                        <div class="product-card">
                            <img 
                                src="${product.image}" 
                                alt="${product.name}" 
                                class="product-image"
                                onerror="this.src='https://via.placeholder.com/200x200?text=No+Image'"
                            >
                            <div class="product-info">
                                <div class="product-name">${product.name}</div>
                                <div class="product-price">$${product.price.toFixed(2)}</div>
                            </div>
                        </div>
                    `;
                });

                resultsContainer.html(html);
            }

            function showLoading() {
                $('#loading').fadeIn(200);
            }

            function hideLoading() {
                $('#loading').fadeOut(200);
            }
        });
    </script>
</body>
</html>
